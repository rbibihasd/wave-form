    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          if (typeof originalFetch === 'function') {
            originalFetch = originalFetch.bind(window);
          }
          var currentFetch = originalFetch;

          // Define on window with both getter and setter so external polyfills/scripts can assign window.fetch without throwing
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });

          // Also define on Window.prototype if accessible
          if (typeof Window !== 'undefined' && Window.prototype) {
            Object.defineProperty(Window.prototype, 'fetch', {
              get: function() {
                return currentFetch;
              },
              set: function(fn) {
                currentFetch = fn;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // Graceful fallback
        }
      })();
    </script>
